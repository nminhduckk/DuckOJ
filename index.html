<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuckOJ — Học lập trình thi đấu từ cơ bản đến nâng cao</title>
    <meta name="description" content="Học lập trình thi đấu qua 74 bài học dễ hiểu, luyện tập bài tập chọn lọc và nộp bài chấm tự động C++17 / Python 3." />
    <meta property="og:title" content="DuckOJ — Học lập trình thi đấu từ cơ bản đến nâng cao" />
    <meta property="og:description" content="Học lập trình thi đấu qua 74 bài học dễ hiểu, luyện tập bài tập chọn lọc và nộp bài chấm tự động." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('duckoj_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-amber-200 selection:text-slate-900 dark:selection:bg-amber-500/30 dark:selection:text-amber-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
